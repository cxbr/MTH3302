name: 0930 exit and left-out-profit audit

on:
  pull_request:
    paths:
      - 'research/0930_multimarket/exit_profit_audit.py'
      - '.github/workflows/0930-exit-profit-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kagglehub pandas numpy requests pyarrow
      - name: Audit exit code and benchmark 61 longer-hold policies
        working-directory: research/0930_multimarket
        run: python -u exit_profit_audit.py
      - name: Upload exit audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0930-exit-profit-audit-results
          path: research/0930_multimarket/exit_audit_output/
          if-no-files-found: warn
