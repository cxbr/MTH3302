name: 0930 hot-stock universe discovery

on:
  pull_request:
    paths:
      - 'research/0930_multimarket/hot_stock_universe_discovery.py'
      - '.github/workflows/0930-hot-stock-universe-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kagglehub
      - name: Discover available liquid-stock minute datasets
        working-directory: research/0930_multimarket
        run: python -u hot_stock_universe_discovery.py
      - name: Upload discovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0930-hot-stock-universe-discovery
          path: research/0930_multimarket/hot_stock_discovery_output/
          if-no-files-found: error
