name: 0930 improved-system refinement benchmark

on:
  pull_request:
    paths:
      - 'research/0930_multimarket/improved_refinement_benchmark.py'
      - '.github/workflows/0930-improved-refinement-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kagglehub pandas numpy requests pyarrow
      - name: Run second-stage refinement benchmark
        working-directory: research/0930_multimarket
        run: python -u improved_refinement_benchmark.py
      - name: Upload refinement results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0930-improved-refinement-results
          path: research/0930_multimarket/improved_refinement_output/
          if-no-files-found: warn
