name: 0930 focused improved-system benchmark

on:
  pull_request:
    paths:
      - 'research/0930_multimarket/improved_system_benchmark.py'
      - '.github/workflows/0930-improved-system-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kagglehub pandas numpy requests pyarrow
      - name: Run focused improved-system benchmark
        working-directory: research/0930_multimarket
        run: python -u improved_system_benchmark.py
      - name: Upload improved benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0930-improved-system-benchmark-results
          path: research/0930_multimarket/improved_output/
          if-no-files-found: warn
