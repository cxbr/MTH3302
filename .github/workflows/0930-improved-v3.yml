name: 0930 improved V3 benchmark

on:
  pull_request:
    paths:
      - 'research/0930_multimarket/improved_strategy_v3.py'
      - '.github/workflows/0930-improved-v3.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kagglehub pandas numpy requests pyarrow
      - name: Run frozen V3 benchmark
        working-directory: research/0930_multimarket
        run: python -u improved_strategy_v3.py
      - name: Upload V3 benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0930-improved-v3-results
          path: research/0930_multimarket/improved_v3_output/
          if-no-files-found: warn
