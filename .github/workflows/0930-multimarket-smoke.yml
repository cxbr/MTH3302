name: 0930 multi-market smoke test

on:
  pull_request:
    paths:
      - 'research/0930_multimarket/smoke_download.py'
      - '.github/workflows/0930-multimarket-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install pytradingview==0.5.0 pandas requests
      - name: Run data smoke test
        run: python research/0930_multimarket/smoke_download.py
      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0930-smoke-output
          path: research/0930_multimarket/smoke_output/
          if-no-files-found: warn
