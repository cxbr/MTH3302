name: 0930 stock-heavy data discovery

on:
  pull_request:
    paths:
      - 'research/0930_multimarket/stock_data_discovery.py'
      - '.github/workflows/0930-stock-data-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kagglehub pandas pyarrow
      - name: Inspect stock minute datasets
        working-directory: research/0930_multimarket
        run: python -u stock_data_discovery.py
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0930-stock-data-discovery
          path: research/0930_multimarket/stock_data_discovery_output/
          if-no-files-found: warn
