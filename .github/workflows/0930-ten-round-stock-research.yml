name: 0930 ten-round stock-heavy strategy research

on:
  pull_request:
    paths:
      - 'research/0930_multimarket/stock_heavy_pipeline.py'
      - 'research/0930_multimarket/ten_round_stock_strategy_research.py'
      - 'research/0930_multimarket/ten_round_stock_strategy_research_v2.py'
      - '.github/workflows/0930-ten-round-stock-research.yml'

permissions:
  contents: read

jobs:
  ten-round-research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kagglehub pandas numpy requests pyarrow
      - name: Run production-engine bug, EMA, leakage, and execution audit
        working-directory: research/0930_multimarket
        run: python -u improved_system_bug_audit_v7.py
      - name: Run all ten stock-heavy improvement rounds
        working-directory: research/0930_multimarket
        run: python -u ten_round_stock_strategy_research_v2.py
      - name: Upload ten-round results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 0930-ten-round-stock-research-results
          path: |
            research/0930_multimarket/verified_bug_audit_output/
            research/0930_multimarket/ten_round_stock_output/
            research/0930_multimarket/ten_round_stock_work/stock_data_quality.csv
            research/0930_multimarket/ten_round_stock_work/stock_data_rejected.csv
          if-no-files-found: warn
