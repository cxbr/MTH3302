name: Hot20 HF prepared-data ten-round benchmark

on:
  push:
    branches:
      - research/hot20-runner-v6-20260811
    paths:
      - '.github/workflows/hot20-hf-benchmark-only.yml'

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hot20-runner-v6-20260811
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: hot20-hf-agg-*
          path: research/0930_multimarket/hot20_hf_aggregated
          merge-multiple: true
          run-id: 31492910051
          github-token: ${{ github.token }}
      - name: Install complete benchmark dependencies
        run: pip install pandas numpy pyarrow duckdb pytz requests
      - name: Restore and adapt audited benchmark engine
        working-directory: research/0930_multimarket
        run: |
          cat hot20_v6_bootstrap/part_* > /tmp/hot20_v6.b64
          base64 --decode /tmp/hot20_v6.b64 > /tmp/hot20_v6.tgz
          tar -xzf /tmp/hot20_v6.tgz || true
          cat hot20_v6_audit_b64/part_* > /tmp/hot20_v6_audit.b64
          base64 --decode /tmp/hot20_v6_audit.b64 > audit_hot20_v6.py
          cat stock_v4_deps_b64/part_* > /tmp/stock_v4_deps.b64
          base64 --decode /tmp/stock_v4_deps.b64 > /tmp/stock_v4_deps.tgz
          tar -xzf /tmp/stock_v4_deps.tgz
          python - <<'PY'
          from pathlib import Path

          p=Path('stock_v4_engine.py')
          s=p.read_text()
          s=s.replace(
              'from improved_strategy_v31 import aligned_bucket_keys',
              '''def aligned_bucket_keys(index, period_minutes):\n    minutes = (index.hour * 60 + index.minute).to_numpy(dtype=np.int32)\n    ordinals = np.asarray([d.toordinal() for d in index.date], dtype=np.int64)\n    before_open = minutes < 570\n    session_ord = ordinals - before_open.astype(np.int64)\n    offset = (minutes - 570) % 1440\n    return session_ord * 1000 + offset // period_minutes'''
          )
          p.write_text(s)

          p=Path('hot20_v6_benchmark.py')
          s=p.read_text()
          s=s.replace('Dukascopy historical M15 CFD/bid-derived candles','Twelve Data one-minute US equity bars via Hugging Face, aggregated to M15')
          s=s.replace('https://www.dukascopy.com/swiss/english/marketwatch/historical/','https://huggingface.co/datasets/twelvedata/financial-world-model')
          s=s.replace('Dukascopy m15; volume is provider/tick volume, not consolidated exchange volume','Twelve Data regular-session trade volume redistributed through the Hugging Face dataset')
          s=s.replace('Dukascopy provider/tick volume; used only as within-stock relative volume','Twelve Data regular-session trade volume; hot ranks use only same-day causal information')
          p.write_text(s)

          p=Path('audit_hot20_v6.py')
          s=p.read_text()
          needle='import hot20_v6_benchmark as bench\n'
          replacement='''import hot20_v6_benchmark as bench\n\n_period_path = Path("hot20_v6_work/periods.json")\nif _period_path.exists():\n    _period_payload = json.loads(_period_path.read_text(encoding="utf-8"))\n    bench.PERIOD_YEARS = {key: tuple(value) for key, value in _period_payload["periods"].items()}\n'''
          if needle not in s:
              raise RuntimeError('Could not patch audit periods')
          s=s.replace(needle,replacement,1)
          p.write_text(s)
          PY
          python -m py_compile hot20_v6_benchmark.py audit_hot20_v6.py backtest_engine.py data_pipeline.py stock_v4_data.py stock_v4_engine.py hot20_hf_finalize.py
      - name: Merge prepared splits into 51-stock M15 universe
        working-directory: research/0930_multimarket
        run: python -u hot20_hf_finalize.py --input-dir hot20_hf_aggregated
      - name: Run independent pre-backtest audit
        working-directory: research/0930_multimarket
        run: python -u audit_hot20_v6.py
      - name: Run all ten sequential Hot20 improvement rounds
        working-directory: research/0930_multimarket
        run: |
          python -u - <<'PY'
          import json
          import hot20_v6_benchmark as bench
          payload=json.load(open('hot20_v6_work/periods.json'))
          bench.PERIOD_YEARS={key:tuple(value) for key,value in payload['periods'].items()}
          print('PERIOD_YEARS',bench.PERIOD_YEARS,flush=True)
          bench.main()
          PY
      - name: Run independent post-backtest portfolio and ledger audit
        working-directory: research/0930_multimarket
        run: python -u audit_hot20_v6.py --post
      - name: Attach preparation manifests
        working-directory: research/0930_multimarket
        run: |
          cp hot20_v6_work/periods.json hot20_v6_output/periods.json
          cp hot20_v6_work/hf_prepare_manifest.json hot20_v6_output/hf_prepare_manifest.json
          cp hot20_hf_aggregated/*_stats.json hot20_v6_output/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hot20-hf-prepared-ten-round-results
          path: research/0930_multimarket/hot20_v6_output/
          if-no-files-found: warn
          retention-days: 90
