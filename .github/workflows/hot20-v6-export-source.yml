name: Export Hot20 V6 source

on:
  push:
    branches:
      - research/hot20-runner-v6-20260811
    paths:
      - '.github/workflows/hot20-v6-export-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hot20-runner-v6-20260811
      - name: Restore source
        working-directory: research/0930_multimarket
        run: |
          cat hot20_v6_bootstrap/part_* > /tmp/hot20_v6.b64
          base64 --decode /tmp/hot20_v6.b64 > /tmp/hot20_v6.tgz
          tar -xzf /tmp/hot20_v6.tgz || true
          cat hot20_v6_audit_b64/part_* > /tmp/hot20_v6_audit.b64
          base64 --decode /tmp/hot20_v6_audit.b64 > audit_hot20_v6.py
          test -s hot20_v6_benchmark.py
          test -s audit_hot20_v6.py
      - uses: actions/upload-artifact@v4
        with:
          name: hot20-v6-source
          path: |
            research/0930_multimarket/hot20_v6_benchmark.py
            research/0930_multimarket/audit_hot20_v6.py
          if-no-files-found: error
