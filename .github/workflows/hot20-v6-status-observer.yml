name: Hot20 V6 status observer

on:
  push:
    branches:
      - research/hot20-runner-v6-20260811
    paths:
      - '.github/workflows/hot20-v6-status-observer.yml'

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hot20-runner-v6-20260811
      - name: Query Hot20 benchmark runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          gh api '/repos/${{ github.repository }}/actions/workflows/hot20-v6-ten-round.yml/runs?branch=research%2Fhot20-runner-v6-20260811&per_page=5' > /tmp/status.json
          python - <<'PY'
          import json
          src=json.load(open('/tmp/status.json'))
          out={'snapshot':'after-source-hash-fix','total_count':src.get('total_count'), 'workflow_runs':[]}
          for r in src.get('workflow_runs',[]):
              out['workflow_runs'].append({k:r.get(k) for k in ['id','name','status','conclusion','event','head_sha','run_number','created_at','updated_at','jobs_url','artifacts_url']})
          json.dump(out, open('research/0930_multimarket/hot20_v6_status.json','w'), indent=2)
          PY
      - name: Commit status snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/0930_multimarket/hot20_v6_status.json
          git commit -m 'Record Hot20 V6 workflow status' || exit 0
          git push origin HEAD:research/hot20-runner-v6-20260811
