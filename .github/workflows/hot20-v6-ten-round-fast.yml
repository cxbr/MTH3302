name: Hot20 V6 ten-round fast benchmark

on:
  push:
    branches:
      - research/hot20-runner-v6-20260811
    paths:
      - 'research/0930_multimarket/hot20_duka_download_fast.mjs'
      - '.github/workflows/hot20-v6-ten-round-fast.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hot20-runner-v6-20260811
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow requests
          cd research/0930_multimarket
          npm install dukascopy-node@1.50.0
      - name: Restore and verify frozen benchmark and audit
        working-directory: research/0930_multimarket
        run: |
          cat hot20_v6_bootstrap/part_* > /tmp/hot20_v6.b64
          base64 --decode /tmp/hot20_v6.b64 > /tmp/hot20_v6.tgz
          tar -xzf /tmp/hot20_v6.tgz || true
          echo 'f7ef7710bc70cd960f06c3dae5667d4eb798cd551e41933dda21a28dc8a5b190  hot20_v6_benchmark.py' | sha256sum --check
          cat hot20_v6_audit_b64/part_* > /tmp/hot20_v6_audit.b64
          base64 --decode /tmp/hot20_v6_audit.b64 > audit_hot20_v6.py
          echo 'db2d0415c1bc6ae050807b4c4a4e3044da481814a7c4334d0d4598ef2b62c823  audit_hot20_v6.py' | sha256sum --check
          python -m py_compile hot20_v6_benchmark.py audit_hot20_v6.py
      - name: Download 72-stock liquid universe
        working-directory: research/0930_multimarket
        run: node hot20_duka_download_fast.mjs
      - name: Run pre-backtest audit
        working-directory: research/0930_multimarket
        run: python -u audit_hot20_v6.py
      - name: Run ten sequential Hot20 improvement rounds
        working-directory: research/0930_multimarket
        run: python -u hot20_v6_benchmark.py
      - name: Run post-backtest audit
        working-directory: research/0930_multimarket
        run: python -u audit_hot20_v6.py --post
      - name: Upload complete outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hot20-v6-ten-round-fast-results
          path: |
            research/0930_multimarket/hot20_v6_output/
            research/0930_multimarket/hot20_v6_work/download_manifest.json
          if-no-files-found: warn
          retention-days: 90
